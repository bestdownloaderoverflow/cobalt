services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9111:9111"  # Cobalt API port exposed through gluetun
      - "8001:8000"
    environment:
      - VPN_SERVICE_PROVIDER=ivpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=uN+0zndf5GxCYWf9M9R115tEISM6uldgTal8/CIai18=
      # - WIREGUARD_PUBLIC_KEY=J5+Bx84LxNPdWEhewOvBV/fGWiDluIBlAcr1QlJZil8=
      - WIREGUARD_ADDRESSES=172.17.218.193/32
      - SERVER_COUNTRIES=United States
      # - WIREGUARD_ENDPOINT_IP=198.54.129.100
      # - VPN_ENDPOINT_PORT=2049
      - DNS_ADDRESS=172.16.0.1
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped

  cobalt-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cobalt-api
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - API_PORT=9111
      - API_URL=${API_URL:-http://localhost:9111/}
      - CUSTOM_INNERTUBE_CLIENT=${CUSTOM_INNERTUBE_CLIENT:-WEB_EMBEDDED}
      - YOUTUBE_SESSION_INNERTUBE_CLIENT=${YOUTUBE_SESSION_INNERTUBE_CLIENT:-WEB_EMBEDDED}
    #   - YOUTUBE_PLAYER_ID=${YOUTUBE_PLAYER_ID:-0004de42}
    restart: unless-stopped
