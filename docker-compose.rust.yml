services:
  # --- Pair 1 ---
  gluetun-1:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun-1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8001:8000" 
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=OOfSjJMALjZll7RqZBOtHs/fMHYTon8hi08iM/EhLWQ=
      - WIREGUARD_ADDRESSES=10.65.22.237/32
      - SERVER_COUNTRIES=USA
      - DNS_ADDRESS=10.64.0.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"secretpassword\"}"
    volumes:
      - ./gluetun/data1:/gluetun
    restart: unless-stopped

  cobalt-api-1:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cobalt-api-1
    network_mode: "service:gluetun-1"
    depends_on:
      - gluetun-1
    environment:
      - WORKER_ID=w1
      - API_PORT=9000
      - API_URL=${API_URL:-https://api.y2mate.run/}
      - CUSTOM_INNERTUBE_CLIENT=${CUSTOM_INNERTUBE_CLIENT:-WEB_EMBEDDED}
      - YOUTUBE_SESSION_INNERTUBE_CLIENT=${YOUTUBE_SESSION_INNERTUBE_CLIENT:-WEB_EMBEDDED}
      - DURATION_LIMIT=5400
    restart: unless-stopped

