services:
  # --- Pair 1 ---
  gluetun-1:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun-1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8001:8000"
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=mJNxbqpODxFWrNpoJnNJt3GAZaegIFuiY6XQekl0zkI=
      - WIREGUARD_ADDRESSES=172.16.0.2/32
      - WIREGUARD_PUBLIC_KEY=bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
      - WIREGUARD_ENDPOINT_IP=162.159.192.1
      - WIREGUARD_ENDPOINT_PORT=2408
      - DNS_ADDRESS=1.1.1.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - "HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={\"auth\":\"basic\",\"username\":\"admin\",\"password\":\"secretpassword\"}"
    volumes:
      - ./gluetun/data1:/gluetun
    restart: unless-stopped

  cobalt-api-1:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cobalt-api-1
    network_mode: "service:gluetun-1"
    depends_on:
      - gluetun-1
    environment:
      - WORKER_ID=w1
      - API_PORT=9000
      - API_LISTEN_ADDRESS=0.0.0.0
      - API_URL=${API_URL:-https://api.y2mate.run/}
      - CUSTOM_INNERTUBE_CLIENT=${CUSTOM_INNERTUBE_CLIENT:-WEB_EMBEDDED}
      - YOUTUBE_SESSION_INNERTUBE_CLIENT=${YOUTUBE_SESSION_INNERTUBE_CLIENT:-WEB_EMBEDDED}
      - YOUTUBE_PLAYER_ID=9f4cc5e4
      - DURATION_LIMIT=5400
    restart: unless-stopped

